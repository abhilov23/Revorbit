version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: revorbit-postgres
    environment:
      POSTGRES_USER: revorbit
      POSTGRES_PASSWORD: revorbit
      POSTGRES_DB: revorbit
    ports:
      - "5432:5432"
    volumes:
      - revorbit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revorbit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: revorbit-redis
    ports:
      - "6379:6379"
    volumes:
      - revorbit-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    container_name: revorbit-worker
    env_file:
      - ../../.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  revorbit-postgres-data:
  revorbit-redis-data:
